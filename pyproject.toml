[project]
name = "offload"
# Placeholder: CI sets the real version from the git tag at build time
version = "0.0.0"
description = "CLI tool to organize photos and videos by extracting EXIF metadata. Automatically creates structured directories and supports archiving to zip files."
authors = [
    {name = "Peter Han",email = "git@peterhan.ca"}
]
license = {text = "MIT"}
readme = "README.md"
# Docker runs Python 3.13 (python:3.13-slim), so the Python version is locked to 3.13
requires-python = ">=3.13,<3.14"
dependencies = [
    "click (>=8.5.1,<9.0.0)",
    "pillow (>=13.0.0,<14.0.0)",
    "pillow-heif (>=1.8.1,<2.0.0)",
    "pyexiftool (>=0.5.6,<0.6.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
requires-poetry = ">=2.5,<3.0"

[tool.pytest]
addopts = ["--cov=offload", "--cov-fail-under=95", "--cov-report=term-missing"]

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pycodestyle (>=2.15.0,<3.0.0)",
]

[project.scripts]
offload = "offload.cli:main"
